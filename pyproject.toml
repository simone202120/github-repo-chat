[project]
name = "github-repo-chat"
version = "0.1.0"
description = "Chat with any public GitHub repository: README, docs and source code indexed with LlamaIndex into Qdrant, answered with citations that link back to the files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langfuse>=4.15.6",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-fastembed>=0.7.0",
    "llama-index-llms-openrouter>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "openinference-instrumentation-llama-index>=4.5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.19.1",
    "streamlit>=1.64.0",
    "tree-sitter-language-pack>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "deptry>=0.23",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pyyaml>=6.0.3",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20260906",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_repo_chat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not llm'"
markers = [
    "integration: needs real infrastructure (docker compose services)",
    "llm: calls a real LLM through OpenRouter (manual only)",
]

[tool.coverage.run]
source = ["src/github_repo_chat"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
known_first_party = ["github_repo_chat"]
# Server run from the command line (Dockerfile, README), never imported.
per_rule_ignores = { DEP002 = ["uvicorn"] }
