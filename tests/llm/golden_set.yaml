  expected_files: [src/tinycalc/calculator.py]
  key_facts: [calculator.py]
- question: Which environment variable controls the printed precision?
  expected_files: [docs/configuration.md, src/tinycalc/cli.py]
  key_facts: [TINYCALC_PRECISION]
- question: What is the default precision?
  expected_files: [docs/configuration.md, src/tinycalc/calculator.py]
  key_facts: ["4"]
- question: Does tinycalc support matrix multiplication?
  expected_files: []
  key_facts: ["don't know"]
