# Golden set on the committed fixture repository (tests/fixtures/tinycalc-main.zip).
# expected_files: at least one must be among the retrieved sources (hit rate@k).
# key_facts: case-insensitive substrings the answer must contain.
- question: What is tinycalc?
  expected_files: [README.md]
  key_facts: [calculator]
- question: How do I install tinycalc?
  expected_files: [README.md]
  key_facts: [pip install tinycalc]
- question: How do I add two numbers from the command line?
  expected_files: [README.md, src/tinycalc/cli.py]
  key_facts: [tinycalc add]
