name: LLM golden-set evaluation

# Real LLM calls cost money: manual trigger only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-set:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m llm -s -q
        env:
          QDRANT_URL: http://localhost:6333
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'google/gemini-3.8-flash' }}
